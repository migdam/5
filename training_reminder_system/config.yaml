# Training Reminder System Configuration
# ========================================

paths:
  input_folder: "data/input"
  output_folder: "data/output"
  archive_folder: "data/archive"
  database: "data/training_reminders.db"
  log_folder: "logs"

# Column mappings: logical name -> actual Excel column header
# Adjust these if your Excel files have different column names
column_mapping:
  eppm:
    project_number: "Project number"
    project_name: "Project Name"
    leading_function: "Leading Function"
    sub_function: "Sub Function"
    active_stage: "Active Stage"
    project_status: "Project Status"
    project_archetype: "Project Archetype"
    project_owner: "Project Owner"
    project_owner_email: "Project Owner Email"
    project_manager: "Project Manager"
    project_manager_email: "Project Manager Email"
    it_project_manager: "IT Project Manager"
    it_project_manager_email: "IT Project Manager Email"
    it_portfolio_manager: "IT Portfolio Manager"
    it_portfolio_manager_email: "IT Portfolio Manager Email"
    g0_compliance: "G0 Compliance"
    g0_action: "G0 Action"
    g3_compliance: "G3 Compliance"
    g3_action: "G3 Action"
    g5_compliance: "G5 Compliance"
    g5_action: "G5 Action"
    g6_compliance: "G6 Compliance"
    g6_action: "G6 Action"
    project_compliance: "Project Compliance"

  # Excluded projects file (manually maintained, ghost/cancelled projects)
  excluded_projects:
    project_id: "project_id"
    reason: "reason"
    reported_date: "reported_date"

  # Role changes file (manually maintained)
  # Updated by users based on feedback when IT PMs change roles
  role_changes:
    it_pm_email: "it_pm_email"
    it_pm_name: "it_pm_name"
    new_role: "new_role"
    reported_date: "reported_date"
    notes: "notes"

  fuse:
    full_name: "Full Name"
    email: "Email"
    employee_group: "Employee Group"
    region: "Geographical Region"
    country: "Country"
    function: "Function"
    position: "Position"
    content_id: "Content ID"
    content_title: "Content Title"
    course_status: "Course Status"
    start_date: "Start Date"
    completion_date: "Completion Date"
    score: "Score"

# Status mappings: what values indicate completed/active
status_mapping:
  training_completed_values:
    - "completed"
  training_incomplete_values:
    - "incomplete"
  project_active_statuses:
    - "Not Completed"
  project_excluded_statuses:
    - "Completed"
    - "Cancelled"
    - "On Hold"
  # Active Stage values that indicate a project is done (ghost if still in ePPM)
  project_completed_stages:
    - "Completed"

# Required training courses: content titles that PMs must complete
required_training:
  fundamentals:
    content_title: "Managing Projects for Business Success - Fundamentals - Certification Test"
    label: "Fundamentals"
  advanced:
    content_title: "Certification Test for Managing Projects for Business Success (Advanced)"
    label: "Advanced"

# Template file paths (relative to project root)
templates:
  stage_1: "templates/reminder_stage_1.txt"
  stage_2: "templates/reminder_stage_2.txt"
  stage_3: "templates/reminder_stage_3.txt"
  default: "templates/reminder_stage_default.txt"
  missing_itpm: "templates/missing_itpm_reminder.txt"
  missing_itpm_escalation: "templates/missing_itpm_escalation.txt"
  role_changed_itpm: "templates/role_changed_itpm_reminder.txt"
  congratulations: "templates/congratulations.txt"
  group_training: "templates/group_training_reminder.txt"
  group_missing_itpm: "templates/group_missing_itpm_reminder.txt"

# Matching rules
matching:
  # Priority order for cross-file matching
  match_by_email: true
  match_by_exact_name: true
  match_by_normalized_name: true

# Communication options
communication:
  max_reminder_stage: 0  # 0 means no limit; uses default template for stage > 3

# Weekly communication schedule
# Defines which day each message type should be sent after the Monday cycle run.
# This organizes the output folder into day-specific subfolders.
comms_schedule:
  monday:
    - run_cycle          # Load data, evaluate, generate all outputs
  tuesday:
    - training_reminders # Individual training reminders (all stages)
    - congratulations    # Congratulations for newly certified PMs
  wednesday:
    - missing_itpm       # Ask PMs to assign IT PM in ePPM
    - role_changed_itpm  # Alert PMs about IT PMs who changed roles
  thursday:
    - escalations        # Escalate to Project Owners (IT PM still missing)
  friday:
    - group_emails       # Consolidated group emails (training + IT PM)
    - nice_to_have       # Optional: suggest Fundamentals to Advanced-certified PMs

# Output options
output:
  generate_per_recipient_files: true
  generate_per_stage_folders: true
  generate_csv: true
  generate_summary: true
  generate_group_emails: true  # Generate single group email files with all recipients in To: field

# File identification patterns (glob patterns to find input files)
file_patterns:
  eppm: "*ePPM*.*xlsx"
  fuse: "*Fuse*.*xlsx"
  role_changes: "*role_changes*.*xlsx"
  excluded_projects: "*excluded_projects*.*xlsx"
